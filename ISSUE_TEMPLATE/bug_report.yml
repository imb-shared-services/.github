name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: The observed behaviour, including the exact error text if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, command, or input that triggers it. Redact any client data.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: "`git rev-parse --short HEAD`, a tag, or a deploy date."
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, environment. No secrets, no client data.
