name: Task
description: A unit of planned work — feature, improvement, or chore
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What will be true when this is done.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Optional. How you intend to do it, and any alternatives considered.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How a reviewer will know it is complete.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Blocked by, blocks, or anything that could make this harder than it looks.
